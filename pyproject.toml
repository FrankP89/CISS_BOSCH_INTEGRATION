[project]
name = "ciss-bosch-integration"
version = "0.1.0"
description = "CISS BOSCH sensor integration for Python 3"
requires-python = ">=3.13"
dependencies = [
    "loguru==0.7.3",
    "psycopg2",
    "pyserial==3.5.0",
    "python-dotenv==1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

